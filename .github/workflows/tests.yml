name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.2', laravel: '6.*', testbench: '4.*' }
          - { php: '7.4', laravel: '6.*', testbench: '4.*' }
          - { php: '7.4', laravel: '7.*', testbench: '5.*' }
          - { php: '7.4', laravel: '8.*', testbench: '6.*' }
          - { php: '8.0', laravel: '8.*', testbench: '6.*' }
          - { php: '8.0', laravel: '9.*', testbench: '7.*' }
          - { php: '8.1', laravel: '10.*', testbench: '8.*' }
          - { php: '8.2', laravel: '10.*', testbench: '8.*' }
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    env:
      # Old Laravel versions in the matrix have published security advisories;
      # do not let Composer refuse to install them.
      COMPOSER_NO_SECURITY_BLOCKING: 1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
